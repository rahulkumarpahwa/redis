services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
     - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
     - "redis_data:/data"


  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
     - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: database_with_redis
    volumes:
      - "mongodb_data:/data/db"

volumes:
  redis_data:
  mongodb_data:
